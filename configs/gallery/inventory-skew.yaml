# PAPER: Avellaneda prices plus smaller quotes away from the signed position target.
# Needs 31 consecutive one-second moving-price samples; gaps restart warmup.
# Flat target is a preference, not an instruction to flatten or increase risk caps.
mode: paper
base_url: https://api.glyde.trade/v1
symbol: BTC
paper_balance: '1000'
strategy: inventory_skewed
strategy_config:
  order_amount: '0.0002'
  order_refresh_time: 30
  minimum_spread: '0.001'
  order_amount_shape_factor: '2'
  risk_factor: '2'
  liquidity_kappa: '1'
  inventory_target_position: '0'
  volatility_samples: 30
  sample_interval_ms: 1000
risk:
  max_position: '0.001'
  max_order_notional: '25'
  max_daily_loss: '5'
  stale_book_seconds: '5'
  account_age_seconds: '10'
