[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "glyde-market-maker"
version = "0.5.0"
description = "Paper-first, exact-decimal market making on Glyde One API"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
dependencies = ["httpx>=0.28,<1", "websockets>=14,<17", "PyYAML>=6,<7", "hyperliquid-python-sdk>=0.21,<1"]

[project.urls]
Homepage = "https://github.com/Glyde-trade/glyde-market-maker"
Source = "https://github.com/Glyde-trade/glyde-market-maker"
Issues = "https://github.com/Glyde-trade/glyde-market-maker/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
glyde-mm = "glyde_mm.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build]
artifacts = ["src/glyde_mm/_build_info.json"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/glyde_mm"]
