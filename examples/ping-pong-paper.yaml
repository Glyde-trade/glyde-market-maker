# PMM with alternating sides after identified partial fills. PAPER ONLY.
# Example sizing reference: BTC 60000 USDC (venue minimum 10 USDC per order). Update prices/amounts for your market.
mode: paper
base_url: https://api.glyde.trade/v1
symbol: BTC
paper_balance: '1000'
strategy: pure_market_making
strategy_config:
  ping_pong_enabled: true
  bid_spread: '0.002'
  ask_spread: '0.002'
  order_amount: '0.0002'
  order_levels: 3
  order_level_spread: '0.001'
  order_level_amount: '0.00002'
  order_refresh_time: 30
  refresh_tolerance_pct: '0.1'
  max_order_age: 300
  price_floor: '50000'
  price_ceiling: '150000'
  hanging_orders_enabled: false
risk:
  max_position: '0.001'
  max_order_notional: '25'
  max_daily_loss: '5'
  max_orders_per_minute: 60
  stale_book_seconds: '5'
  account_age_seconds: '10'
