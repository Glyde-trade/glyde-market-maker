# No trading key is needed. Orders and balances are simulated against the public book.
mode: paper
base_url: https://api.glyde.trade/v1
symbol: BTC
paper_balance: '1000'
strategy: pure_market_making
strategy_config:
  bid_spread: '0.002'
  ask_spread: '0.002'
  order_amount: '0.0002'
  order_refresh_time: 30
  refresh_tolerance_pct: '0.1'
  max_order_age: 300
  order_levels: 1
  minimum_spread: '0.001'
  hanging_orders_enabled: false
risk:
  max_position: '0.001'
  max_order_notional: '25'
  max_orders_per_minute: 60
  max_daily_loss: '5'
  stale_book_seconds: '5'
  account_age_seconds: '10'
