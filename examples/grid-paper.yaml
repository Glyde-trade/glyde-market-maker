# This 52000–68000 band brackets BTC near 59000 (Nov 2026); re-centre it if BTC leaves it.
# Or choose grid in `glyde-mm init` for a cap-budgeted beginner preset.
# Levels span the whole fixed band; they do not re-center with the market.
mode: paper
base_url: https://api.glyde.trade/v1
symbol: BTC
paper_balance: '1000'
strategy: grid
strategy_config:
  lower_price: '52000'
  upper_price: '68000'
  order_amount: '0.0002'
  levels: 5
  order_refresh_time: 30
  minimum_spread: '0.001'
risk:
  max_position: '0.001'
  max_order_notional: '25'
  max_daily_loss: '5'
  stale_book_seconds: '5'
  account_age_seconds: '10'
