name: Bug report
description: Report an installation, paper, live or diagnostic problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Running a founder bot? `bash scripts/report-bug.sh ~/glyde-mm/<preset>` fills this in for you
        (redacted) and checks for an existing issue first.
        Never post signing keys, read credentials, authorization headers or signed requests.
        Use `glyde-mm report <logdir>` for a bounded summary; review it before sharing.
        Describe suspected security vulnerabilities privately to the repository maintainers.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of glyde-mm --version; include your OS and Python version if relevant.
      placeholder: glyde-mm 0.2.0; Python 3.12; Linux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where does it happen?
      options:
        - Live on Glyde (founder preset)
        - Live mode (own config)
        - Paper mode
        - Installation or diagnostics
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Founder preset
      options:
        - Not a founder preset
        - tight-ladder
        - hl-anchored
        - adaptive-vol
        - inventory-shy
        - grid-wall
        - deep-book
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List commands, steps and timing. An offline or paper reproduction is preferred.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Include the exact refusal category if available, without raw request/error bodies.
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Relevant non-secret settings
      description: Include only mode, symbol, strategy settings and risk caps. Omit account identifiers.
      render: yaml
  - type: textarea
    id: report
    attributes:
      label: Reviewed support summary
      description: Optional output from glyde-mm report, after checking it contains nothing private.
      render: json
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, authorization headers, signed requests and private account details.
          required: true
