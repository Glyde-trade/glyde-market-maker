name: Release Python package
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Release tag must match the version in pyproject.toml')
          PY
      - name: Extract versioned release notes
        run: python scripts/release-notes.py > release-notes.md
      - run: python -m pip install 'pip>=23' 'build>=1.2,<2' 'twine>=6,<7'
      - run: python scripts/write-build-info.py "$GITHUB_SHA"
      - name: Build sdist and wheel
        run: python -m build
      - name: Check PyPI distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel
        run: python scripts/check-wheel-install.py dist/*.whl --expected-commit "$GITHUB_SHA"
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz
          --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
      - name: Retain checked distributions for trusted publishing
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish-pypi:
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/glyde-market-maker
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish checked distributions with PyPI trusted identity
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
