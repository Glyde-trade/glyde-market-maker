name: Container paper acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'aiohttp>=3.11,<4' 'PyYAML>=6,<7'
      - run: python scripts/write-build-info.py "$GITHUB_SHA"
      - name: Build actual retail image
        run: >-
          docker build --build-arg VERSION="$GITHUB_REF_NAME"
          --build-arg REVISION="$GITHUB_SHA" -t glyde-mm:smoke .
      - name: Run real paper CLI for 20 seconds and verify graceful cleanup
        env:
          PYTHONPATH: src
        run: python scripts/container-smoke.py glyde-mm:smoke
