name: Python
on: [push, pull_request]
permissions:
  contents: read
jobs:
  container:
    uses: ./.github/workflows/container-smoke.yml
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src/glyde_mm
      - run: pytest -q -m "not offline_soak"
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pip>=23' 'build>=1.2,<2' 'twine>=6,<7'
      - run: python scripts/write-build-info.py "$GITHUB_SHA"
      - run: python scripts/release-notes.py > /dev/null
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check-wheel-install.py dist/*.whl --expected-commit "$GITHUB_SHA"
  offline-soak:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: timeout 90s python -m pytest -q -s tests/test_offline_soak.py tests/test_live_state.py -k "offline_soak or actual_live_runner_uses_http_only_for_startup"
